<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1634">
<title>AUA FIT · Reservas AquaBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1634;--navy2:#071028;--blue:#003DFC;--blue-h:#002BB5;--cyan:#008BD2;--lb:#B6DCF1;--ice:#D8E9F4;
  --bg:#F4F8FB;--card:#fff;--border:#E3ECF3;--text:#0B1634;--muted:#5B6478;
  --success:#15803D;--warn:#A3440E;--danger:#C62828;
  --shadow:0 1px 2px rgba(11,22,52,.06),0 6px 18px rgba(11,22,52,.05);
  --hf:'Source Sans 3',system-ui,sans-serif;
}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Header: logo blanco arriba a la izquierda */
.header{background:var(--navy);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
.header-logo{display:block;height:30px;width:auto}
.hbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}

/* Hero azul con esquinas redondeadas */
.hero{background:var(--navy);color:#fff;padding:6px 20px 26px;border-radius:0 0 28px 28px}
.hero-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.hero-k{font-size:13px;color:var(--lb)}
.hero h1{font-family:var(--hf);font-weight:900;font-size:30px;line-height:1.1}
.hero-s{font-size:13px;color:var(--lb)}

.page{display:none}.page.active{display:block}
.wrap{padding:20px;max-width:760px;margin:0 auto}

/* Navegación de semana dentro del hero */
.wnav{display:flex;align-items:center;gap:10px;margin-top:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:8px}
.wbtn{width:44px;height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wbtn:hover{background:var(--blue)}
.wlbl{flex:1;text-align:center;font-family:var(--hf);font-size:17px;font-weight:800;color:#fff}

.dg{margin-bottom:22px}
.dh{font-family:var(--hf);font-size:19px;font-weight:800;color:var(--navy);margin-bottom:10px;padding-left:2px;display:flex;align-items:baseline;gap:8px}
.dh small{font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--muted)}

/* Tarjeta de clase */
.cc{background:var(--card);border-radius:18px;padding:14px 14px 14px 12px;display:flex;align-items:center;gap:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.tc{width:60px;display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
.tc b{font-family:var(--hf);font-weight:800;font-size:20px;color:var(--navy)}
.tc span{font-size:11px;color:var(--muted)}
.vd{width:1px;align-self:stretch;background:var(--ice);flex-shrink:0}
.ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cn{font-size:15px;font-weight:600;color:var(--navy)}
.cl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.cl svg.i{width:13px;height:13px}
.cs{font-size:12px;font-weight:500}
.sok{color:var(--muted)}.slow{color:var(--warn)}.szero{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:22px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;text-decoration:none}
.br{background:var(--blue);color:#fff}.br:hover{background:var(--blue-h)}
.bw{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}.bw:hover{background:var(--ice)}
.bg{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.bg:hover{background:var(--bg)}
.bd{background:#FDECEC;color:var(--danger);border:1px solid #F5C2C2}
.bds{background:var(--danger);color:#fff}.bds:hover{background:#A61F1F}
.bs{background:#E3F4EA;color:var(--success);border:1px solid #A7DDBA}
.bx{background:#1D6F42;color:#fff}.bx:hover{background:#155734}
.bwa{background:#25D366;color:#0B1634}
.bsm{min-height:34px;padding:0 12px;font-size:12px;border-radius:17px}
.bpast{background:#EEF2F6;color:var(--muted);cursor:not-allowed;font-size:12px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(7,16,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(7,16,40,.3)}
.mt{font-family:var(--hf);font-size:24px;font-weight:900;color:var(--navy);margin-bottom:4px;line-height:1.15}
.ms{font-size:13px;color:var(--muted);margin-bottom:20px}
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.fi{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;outline:none;transition:.15s;background:#fff;color:var(--text)}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,61,252,.12)}
.fi.err{border-color:var(--danger)}
.tc2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.to{border:2px solid var(--border);border-radius:16px;padding:18px 12px;cursor:pointer;text-align:center;transition:.15s}
.to:hover{border-color:var(--cyan)}.to.sel{border-color:var(--blue);background:#EEF3FF}
.to .ti{width:44px;height:44px;margin:0 auto 8px;border-radius:22px;background:var(--ice);color:var(--blue);display:flex;align-items:center;justify-content:center}
.to .ti svg.i{width:22px;height:22px}
.to .ti{font-size:22px}
.to .tn{font-size:15px;font-weight:700;color:var(--navy)}
.to .td{font-size:12px;color:var(--muted);margin-top:2px}
.po{border:2px solid var(--border);border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;transition:.15s}
.po:hover{border-color:var(--cyan)}.po.sel{border-color:var(--blue);background:#EEF3FF}
.pn{font-family:var(--hf);font-size:16px;font-weight:800;color:var(--navy)}
.pd{font-size:12px;color:var(--muted);margin-top:2px}
.mf{display:flex;gap:8px;margin-top:20px}.mf .btn{flex:1}
.cbox{margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
.ctit{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:12px}
.citem{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;cursor:pointer}
.citem input[type=checkbox]{margin-top:3px;flex-shrink:0;width:18px;height:18px;accent-color:var(--blue);cursor:pointer}
.ctxt{font-size:12px;color:var(--muted);line-height:1.6}
.ctxt b{color:var(--text);display:block;margin-top:6px}

/* Éxito */
.sb{text-align:center;padding:6px 0}
.si{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.si svg.i{width:40px;height:40px;stroke-width:2.2}
.sig{background:#E6EEFF;color:var(--blue)}.sir{background:#FDECEC;color:var(--danger)}.sia{background:#FFF4E5;color:var(--warn)}
.stit{font-family:var(--hf);font-size:26px;font-weight:900;color:var(--navy);margin-bottom:12px;line-height:1.15}
.sdet{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--navy);line-height:1.7;text-align:left}

/* Admin */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.scard{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.sv{font-family:var(--hf);font-size:32px;font-weight:900;color:var(--navy)}.slbl{font-size:12px;color:var(--muted);margin-top:2px}
.acard{background:var(--card);border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.ach{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.act{font-size:15px;font-weight:700;color:var(--navy)}
.pb{height:8px;background:var(--ice);border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .3s}
.pok{background:var(--blue)}.plo{background:#D97706}.pfu{background:var(--danger)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.bbl{background:#E6EEFF;color:var(--blue)}.bgr{background:#E3F4EA;color:var(--success)}
.bam{background:#FFF4E5;color:var(--warn)}.bre{background:#FDECEC;color:var(--danger)}
.rl{max-height:320px;overflow-y:auto}
.rr{padding:10px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);font-size:13px}
.rr:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:50%;background:var(--ice);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy);flex-shrink:0}
.ri{flex:1;min-width:0}
.rn{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{font-size:12px;color:var(--muted)}
.sw2{position:relative;margin-bottom:16px}
.si2{width:100%;min-height:46px;padding:10px 14px 10px 42px;border:1.5px solid var(--border);border-radius:14px;font-size:14px;outline:none;background:#fff}
.si2:focus{border-color:var(--blue)}
.sic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.wb{background:#FFF4E5;color:var(--warn);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px}
.ld{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.sp{width:28px;height:28px;border:3px solid var(--ice);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ntf{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:22px;font-size:13px;font-weight:600;z-index:200;animation:sli .3s ease;box-shadow:0 6px 20px rgba(7,16,40,.3);max-width:calc(100% - 32px);text-align:center}
@keyframes sli{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.eb{background:#EEF3FF;border:1.5px solid #C9D7FF;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--navy);line-height:1.6}
.eb strong{color:var(--navy)}
.div{border:none;border-top:1px solid var(--border);margin:16px 0}
.atb{display:flex;justify-content:flex-start;margin-top:14px}
#page-admin .hero-in,#page-admin .wrap{max-width:1100px}
.rvc{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.rvi{flex:1;min-width:0}
.rvcl{font-size:15px;font-weight:700;color:var(--navy)}
.rvcm{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:28px 20px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.empty .si{width:64px;height:64px}
.empty .si svg.i{width:28px;height:28px}
/* Cuadros de días */
.days{display:grid;gap:8px;margin-top:14px}
.dchip{min-height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:rgba(255,255,255,.06);color:var(--ice);border:1px solid rgba(255,255,255,.16);transition:.15s}
.dchip:hover{background:rgba(255,255,255,.14)}
.dchip .dw{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dchip .dn{font-family:var(--hf);font-size:21px;font-weight:800}
.dchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dchip.past{opacity:.5}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sech h2{font-family:var(--hf);font-weight:800;font-size:20px;color:var(--navy)}
.sech span{font-size:13px;color:var(--muted)}
.cic{font-size:18px;margin-right:4px}
.cins{font-size:12px;color:var(--muted)}

/* Detalle de clase */
.dhero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy) 55%,var(--blue) 100%)}
.badge2{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--lb);padding:5px 10px;border-radius:999px;margin-bottom:6px}
.dtit{display:flex;align-items:center;gap:14px}
.dic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.icard{background:#fff;border-radius:18px;padding:4px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.irow{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.irow:last-child{border-bottom:none}
.irow>svg.i{width:22px;height:22px;color:var(--cyan)}
.ik{font-size:12px;color:var(--muted)}.iv{font-size:15px;font-weight:600;color:var(--navy)}
.ncard{background:#fff;border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.ncard b{display:block;font-family:var(--hf);font-weight:800;font-size:16px;color:var(--navy);margin-bottom:4px}
.ncard p{font-size:13px;line-height:1.55;color:#3B4458}
.cta{width:100%;min-height:56px;border-radius:28px;font-family:var(--hf);font-size:17px;font-weight:800}

/* Confirmación */
.cf{min-height:calc(100vh - 72px);background:radial-gradient(120% 70% at 50% 0%,#00349E 0%,var(--navy) 60%,var(--navy2) 100%);color:#fff;padding:36px 24px 44px}
.cf-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.cfi{width:96px;height:96px;border-radius:48px;background:rgba(0,139,210,.18);border:1px solid rgba(182,220,241,.35);display:flex;align-items:center;justify-content:center;color:var(--lb)}
.cfi svg.i{width:44px;height:44px;stroke-width:2.2}
.cf h1{font-family:var(--hf);font-weight:900;font-size:32px;line-height:1.1}
.cf p{font-size:15px;line-height:1.5;color:var(--ice);max-width:320px}
.cfs{width:100%;margin-top:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:6px 18px;text-align:left}
.cfr{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.cfr:last-child{border-bottom:none}
.cfr span{font-size:13px;color:var(--lb)}.cfr b{font-size:14px;font-weight:600;text-align:right}
.bwh{background:#fff;color:var(--navy)}.bwh:hover{background:var(--ice)}
.blk{background:none;color:var(--lb)}.blk:hover{color:#fff}
@media(max-width:560px){
  .sgrid{grid-template-columns:1fr 1fr}.tc2{grid-template-columns:1fr}
  .hbtn{padding:0 14px}
  .cc{gap:10px}.cc .btn{padding:0 14px}.tc{width:52px}
  .rr{flex-wrap:wrap}
}
</style>
</head>

function getMon(o=0){const d=new Date(),dy=d.getDay(),df=d.getDate()-dy+(dy===0?-6:1);d.setDate(df+o*7);d.setHours(0,0,0,0);return d;}
function getWeek(o=0){
  const mon=getMon(o);
  return SCH.map(t=>{
    const d=new Date(mon);d.setDate(d.getDate()+(t.day===0?6:t.day-1));
    const ds=d.toISOString().split('T')[0];
    const id=`${ds}_${t.time.replace(/\s/g,'').replace(':','')}`;
    return{...t,date:d,ds,id};
  });
}

function fds(d){return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'})}
function ini(n){return(n||'?').trim().split(' ').slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function nph(p){return(p||'').replace(/\D/g,'')}

let selDay=null;

async function renderSchedule(){
  const cls=getWeek(wOff);
  const mon=getMon(wOff),sun=new Date(mon);sun.setDate(sun.getDate()+6);
  document.getElementById('week-label').textContent=`${fds(mon)} — ${fds(sun)}`;
  // Cuadros con los días de la semana que tienen clase
  const days=[];cls.forEach(c=>{if(!days.find(d=>d.ds===c.ds))days.push(c);});
  const now=today0();
  if(!selDay||!days.find(d=>d.ds===selDay))selDay=(days.find(d=>d.date>=now)||days[0]).ds;
  const chips=document.getElementById('day-chips');
  chips.style.gridTemplateColumns=`repeat(${days.length},minmax(0,1fr))`;
  chips.innerHTML=days.map(d=>`<button class="dchip${d.ds===selDay?' on':''}${d.date<now?' past':''}" onclick="selectDay('${d.ds}')" aria-label="${d.label} ${fds(d.date)}"><span class="dw">${d.label.slice(0,3)}</span><span class="dn">${d.date.getDate()}</span></button>`).join('');
  const con=document.getElementById('schedule-container');
  con.innerHTML='<div class="ld"><div class="sp"></div>Actualizando...</div>';
  const dayCls=cls.filter(c=>c.ds===selDay);
  const sm={};
  await Promise.all(dayCls.map(async c=>{const rv=await getRvs(c.id),wl=await getWL(c.id);sm[c.id]={b:rv.length,w:wl.length};}));
  const d0=dayCls[0];
  let html=`<div class="sech"><h2>${d0.label} ${fds(d0.date)}</h2><span>${dayCls.length} clase${dayCls.length===1?'':'s'}</span></div>`;
  dayCls.forEach(c=>{
    const{b,w}=sm[c.id]||{b:0,w:0};
    const sp=CAP-b,full=sp<=0;
    const sc=full?'szero':sp<=2?'slow':'sok';
    const past=c.date<now;
    const st=full?`Clase llena${w>0?` · ${w} en espera`:''}`:`${sp} cupo${sp===1?'':'s'} disponible${sp===1?'':'s'}`;
    const [hh,ap]=c.time.split(' ');
    const btn=past
      ?`<button class="btn bpast" disabled>Fecha pasada</button>`
      :full
      ?`<button class="btn bw" onclick="openDetail('${c.id}')">Lista de espera</button>`
      :`<button class="btn br" onclick="openDetail('${c.id}')">Reservar</button>`;
    html+=`<div class="cc"><div class="tc"><b>${hh}</b><span>${ap||''}</span></div><div class="vd"></div><div class="ci"><div class="cn"><span class="cic">${c.icon}</span>AquaBOARD ${c.name}</div><div class="cins">con ${INSTR.name}</div><div class="cs ${sc}">${st}</div></div>${btn}</div>`;
  });
  con.innerHTML=html;
}

async function finalize(){
  const{classId,info,client,plan,wl}=mSt;
  const data={name:client.name,phone:client.phone||'',cedula:client.cedula||'',email:client.email||'',plan:plan.name,planId:plan.id,type:plan.id==='primera'?'primera':'plan',createdAt:new Date().toISOString()};
  if(wl){await addWL2(classId,data);showSuccess(client.name,info,plan,true);}
  else{
    const ex=await getRvs(classId);
    if(ex.length>=CAP){ntf('Clase llena. Agregando a lista de espera...');await addWL2(classId,data);showSuccess(client.name,info,plan,true);return;}
    const dup=ex.find(r=>nph(r.phone)===nph(client.phone)||(client.cedula&&r.cedula===client.cedula));
    if(dup){ntf(`${client.name} ya tiene reserva en esta clase`);closeOv();renderSchedule();return;}
    await addRv(classId,data);showSuccess(client.name,info,plan,false);
  }
  renderSchedule();
}

    <h1>${wl?'Quedaste en lista de espera':'¡Tu cupo está reservado!'}</h1>
    <p>${wl?'Si se libera un cupo te avisaremos por WhatsApp.':'Te esperamos en la piscina del Hotel InterContinental Cali.'}</p>
    <div class="cfs">
      <div class="cfr"><span>Nombre</span><b>${name}</b></div>
      <div class="cfr"><span>Clase</span><b>${c.icon||''} AquaBOARD ${info.name}</b></div>
      <div class="cfr"><span>Fecha</span><b>${fecha}</b></div>
      <div class="cfr"><span>Instructor</span><b>${INSTR.name}</b></div>
      <div class="cfr"><span>Lugar</span><b>Piscina · InterContinental Cali</b></div>
      <div class="cfr"><span>Plan</span><b>${plan.icon||''} ${plan.name}</b></div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="btn bwh cta" onclick="showPage('client')">Volver a clases</button>
      <button class="btn blk" onclick="showPage('cancel')">Ver o cancelar mis reservas</button>
    </div>`;
  showPage('confirm');
}

async function searchRes(){
  const phone=document.getElementById('cancel-phone').value.trim();
  if(!phone){document.getElementById('cancel-phone').classList.add('err');ntf('Ingresa tu número de WhatsApp');return;}
  document.getElementById('cancel-phone').classList.remove('err');
  const el=document.getElementById('cancel-results');
  el.innerHTML='<div class="ld"><div class="sp"></div>Buscando...</div>';
  const rvs=await getRvsByPhone(phone);
  const map=getMap();
  const now=new Date();now.setHours(0,0,0,0);
  const active=rvs.filter(r=>{const c=map[r.classId];return c&&c.date>=now;});
  if(active.length===0){el.innerHTML=`<div class="empty"><div class="si sig">${IC.search}</div><div style="font-family:var(--hf);font-size:19px;font-weight:800;color:var(--navy);margin-bottom:6px">No encontramos reservas</div><div style="font-size:13px;color:var(--muted)">No hay reservas activas para el número ${phone}</div></div>`;return;}
  let html=`<div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px">Reservas activas — ${active.length} encontrada${active.length>1?'s':''}</div>`;
  active.forEach(r=>{
    const c=map[r.classId]||{};
    html+=`<div class="rvc"><div class="rvi"><div class="rvcl">AquaBOARD ${c.name||r.classId}</div><div class="rvcm">${c.label||''} ${c.time||''} · ${c.ds||''}</div><div class="rvcm">${r.name} · ${r.plan}</div></div><button class="btn bd" onclick="cfmCancel('${r.id}','${r.classId}','${(c.name||'').replace(/'/g,"\\'")}','${(c.label||'')+' '+(c.time||'')}','${r.name}','${nph(r.phone)}')">Cancelar</button></div>`;
  });
  el.innerHTML=html;
}
function cfmCancel(rid,cid,cn,ct,rname,rphone){
  showOv();
  document.getElementById('mc').innerHTML=`
    <div class="mt">Cancelar reserva</div>
    <div class="ms">¿Seguro que deseas cancelar?</div>
    <div style="background:#FDF3F3;border:1.5px solid #F5C2C2;border-radius:14px;padding:14px;margin-bottom:16px"><div style="font-size:15px;font-weight:700;color:var(--navy)">${cn}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${ct}</div><div style="font-size:13px;color:var(--muted)">${rname}</div></div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Si hay personas en lista de espera, se les notificará por WhatsApp.</p>
    <div class="mf">
      <button class="btn bg" onclick="closeOv()">No, volver</button>
      <button class="btn bds" onclick="doCancel('${rid}','${cid}','${cn}','${ct}','${rname}','${rphone}')">Sí, cancelar</button>
    </div>`;
}
async function doCancel(rid,cid,cn,ct,rname,rphone){
  document.getElementById('mc').innerHTML='<div class="ld"><div class="sp"></div>Cancelando...</div>';
  await delRv(rid);
  const wl=await getWL(cid);
  let waLink=null;
  if(wl.length>0){const f=wl[0];const msg=encodeURIComponent(`🎉 ¡Hola ${f.name}! Se liberó un cupo en AUA FIT.\n\n📅 Clase: ${cn}\n🗓️ ${ct}\n📍 Hotel InterContinental Cali\n\n¡Entra a reservas.auafit.com para confirmar tu cupo! 💧`);const fp=nph(f.phone);waLink=fp?`https://wa.me/${fp}?text=${msg}`:null;}
  renderSchedule();
  document.getElementById('mc').innerHTML=`
    <div class="sb">
      <div class="si sir">${IC.check}</div>
      <div class="stit">Reserva cancelada</div>
      <div class="sdet">${rname}<br>${cn} · ${ct}<br>Tu cupo ha sido liberado.</div>
      ${waLink?`<div style="margin-top:16px;padding:14px;background:#E3F4EA;border-radius:14px;border:1px solid #A7DDBA"><div style="font-size:13px;font-weight:600;color:var(--success);margin-bottom:10px">Hay ${wl.length} persona${wl.length>1?'s':''} en lista de espera</div><a href="${waLink}" target="_blank" class="btn bwa" style="width:100%">${IC.wa} Notificar a ${wl[0].name}</a></div>`:''}
      <div style="margin-top:14px"><button class="btn bg" onclick="closeOv();showPage('client')" style="width:100%">Volver al horario</button></div>
    </div>`;
  document.getElementById('cancel-results').innerHTML='';
  document.getElementById('cancel-phone').value='';
}

async function renderAdmin(){
  const q=document.getElementById('admin-search')?.value?.toLowerCase()||'';
  let aR=[],aW=[];
  if(DEMO){Object.keys(dR).forEach(k=>{if(k.startsWith('w_'))dR[k].forEach(r=>aW.push({...r,classId:k.replace('w_','')}));else dR[k].forEach(r=>aR.push({...r,classId:k}));});}
  else{const[sR,sW]=await Promise.all([gDB().collection('reservations').get(),gDB().collection('waitlist').get()]);aR=sR.docs.map(d=>({id:d.id,...d.data()}));aW=sW.docs.map(d=>({id:d.id,...d.data()}));}
  const map=getMap();
  const gr={};
  aR.forEach(r=>{if(!gr[r.classId])gr[r.classId]={rv:[],wl:[]};gr[r.classId].rv.push(r);});
  aW.forEach(r=>{if(!gr[r.classId])gr[r.classId]={rv:[],wl:[]};gr[r.classId].wl.push(r);});
  const cls=Object.keys(gr).map(id=>({...(map[id]||{id,name:id,icon:'',label:'—',time:'—',ds:'',date:new Date(0)}),rv:gr[id].rv,wl:gr[id].wl})).sort((a,b)=>new Date(a.ds||0)-new Date(b.ds||0));
  const tot=aR.length,wtot=aW.length,full=cls.filter(c=>c.rv.length>=CAP).length;
  document.getElementById('admin-stats').innerHTML=`
    <div class="scard"><div class="sv">${tot}</div><div class="slbl">Reservas totales</div></div>
    <div class="scard"><div class="sv">${cls.length}</div><div class="slbl">Clases con reservas</div></div>
    <div class="scard"><div class="sv">${full}</div><div class="slbl">Clases llenas</div></div>
    <div class="scard"><div class="sv">${wtot}</div><div class="slbl">En lista de espera</div></div>`;
  let html='';
  for(const c of cls){
    const pct=Math.round(c.rv.length/CAP*100);
    const pfc=pct>=100?'pfu':pct>=60?'plo':'pok';
    const bdc=pct>=100?'bre':pct>=60?'bam':'bgr';
    const fr=q?c.rv.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.cedula||'').includes(q)||(r.phone||'').includes(q)):c.rv;
    const fw=q?c.wl.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.cedula||'').includes(q)||(r.phone||'').includes(q)):c.wl;
    if(q&&fr.length===0&&fw.length===0)continue;
    const rr=fr.map(r=>{
      const msg=encodeURIComponent(`✅ ¡Hola ${r.name}! Tu reserva en AUA FIT ha sido confirmada.\n\n📅 Clase: ${c.name}\n🗓️ ${c.label} ${c.time}\n👤 Instructor: ${INSTR.name}\n📍 Hotel InterContinental Cali · Piscina\n💳 ${r.plan}\n\n¡Te esperamos! 💧\nAUA FIT · AquaBOARD`);
      const wp=nph(r.phone);const wl=wp?`https://wa.me/${wp}?text=${msg}`:'#';
      return `<div class="rr"><div class="av">${ini(r.name)}</div><div class="ri"><div class="rn">${r.name}</div><div class="rd">${r.phone||'—'} ${r.cedula?'· CC '+r.cedula:''} · <span class="badge ${r.type==='primera'?'bam':'bbl'}">${r.plan}</span></div></div><div style="display:flex;gap:6px"><a href="${wl}" target="_blank" class="btn bsm bwa">${IC.wa} WA</a><button class="btn bsm bd" onclick="delR('${c.id}','${r.id}')">Cancelar</button></div></div>`;
    }).join('');
    const wr=fw.map(r=>`<div class="rr" style="background:#FFFAF2"><div class="av" style="background:#FFF4E5;color:var(--warn)">${ini(r.name)}</div><div class="ri"><div class="rn">${r.name} <span class="wb">espera</span></div><div class="rd">${r.phone||'—'} · ${r.plan}</div></div><button class="btn bsm bs" onclick="promW('${c.id}','${r.id}')">${IC.up} Mover</button></div>`).join('');
    html+=`<div class="acard"><div class="ach"><div><span class="act">AquaBOARD ${c.name}</span><span style="font-size:12px;color:var(--muted);margin-left:8px">${c.label} ${c.time} · ${c.ds}</span></div><div style="display:flex;align-items:center;gap:8px"><div class="pb" style="width:80px"><div class="pf ${pfc}" style="width:${Math.min(pct,100)}%"></div></div><span style="font-size:13px;min-width:36px;text-align:right">${c.rv.length}/${CAP}</span><span class="badge ${bdc}">${pct}%</span></div></div>${fr.length||fw.length?`<div class="rl">${rr}${wr}</div>`:`<div style="padding:14px 18px;font-size:13px;color:var(--muted)">Sin reservas</div>`}</div>`;
  }
  document.getElementById('admin-container').innerHTML=html||'<div class="ld">Sin resultados</div>';
}
async function delR(cid,id){await delRv2(cid,id);ntf('Reserva cancelada');renderAdmin();renderSchedule();}
async function promW(cid,id){
  if(DEMO){const wl=dR['w_'+cid]||[];const it=wl.find(r=>r.id===id);if(!it)return;dR['w_'+cid]=wl.filter(r=>r.id!==id);await addRv(cid,it);}
  else{const s=await gDB().collection('waitlist').doc(id).get();if(!s.exists)return;const it={...s.data()};await gDB().collection('reservations').add({...it,createdAt:new Date()});await gDB().collection('waitlist').doc(id).delete();}
  ntf('Cliente promovido a reserva');renderAdmin();renderSchedule();
}
async function exportXLS(){
  ntf('Generando Excel...');
  let aR=[],aW=[];
  if(DEMO){Object.keys(dR).forEach(k=>{if(k.startsWith('w_'))dR[k].forEach(r=>aW.push({...r,classId:k.replace('w_','')}));else dR[k].forEach(r=>aR.push({...r,classId:k}));});}
  else{const[sR,sW]=await Promise.all([gDB().collection('reservations').get(),gDB().collection('waitlist').get()]);aR=sR.docs.map(d=>({id:d.id,...d.data()}));aW=sW.docs.map(d=>({id:d.id,...d.data()}));}
  const map=getMap();
  const rows=[...aR.map(r=>{const c=map[r.classId]||{};return{'Clase':c.name||r.classId,'Día':c.label||'','Hora':c.time||'','Fecha':c.ds||'','Estado':'Confirmado','Nombre':r.name||'','Cédula':r.cedula||'','Teléfono':r.phone||'','Email':r.email||'','Plan':r.plan||'','Tipo':r.type||'','Fecha reserva':r.createdAt||''};}),
    ...aW.map(r=>{const c=map[r.classId]||{};return{'Clase':c.name||r.classId,'Día':c.label||'','Hora':c.time||'','Fecha':c.ds||'','Estado':'Lista espera','Nombre':r.name||'','Cédula':r.cedula||'','Teléfono':r.phone||'','Email':r.email||'','Plan':r.plan||'','Tipo':r.type||'','Fecha reserva':r.createdAt||''};})];
  if(rows.length===0){ntf('No hay reservas para exportar');return;}
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Reservas');
  XLSX.writeFile(wb,`AUAFIT_Reservas_${new Date().toISOString().split('T')[0]}.xlsx`);
  ntf('Excel descargado');
}

// Botón de la esquina derecha según la pantalla
function setHdr(p){
  const hb=document.getElementById('cancel-nav-btn');
  if(p==='client'){hb.style.display='inline-flex';hb.innerHTML=IC.cal+'<span>Cancelar reserva</span>';hb.setAttribute('aria-label','Cancelar reserva');hb.onclick=()=>showPage('cancel');}
  else if(p==='detail'||p==='cancel'){hb.style.display='inline-flex';hb.innerHTML=IC.x;hb.setAttribute('aria-label','Volver a clases');hb.onclick=()=>showPage('client');}
  else hb.style.display='none';
}
function showPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  setHdr(p);
  if(p==='admin')renderAdmin();
  window.scrollTo(0,0);
}

try{if(!DEMO)firebase.initializeApp(FB);}catch(e){}
setHdr('client');
chkAdmin();
renderSchedule();
</script>
